apiVersion: apps/v1
kind: Deployment

metadata:
  name: server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: server

  template:
    metadata:
      labels:
        app: server

    spec:
      containers:
        - name: server

          image: registry.uniproject.jp/official/presen-comeview-api:0.1.0

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: HOST
              value: "0.0.0.0"

            - name: BASE_URL
              value: "api-comeview.uniproject.jp"

            - name: WEB_URL
              value: "comeview.uniproject.jp"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
