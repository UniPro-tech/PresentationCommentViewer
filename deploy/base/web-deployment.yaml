apiVersion: apps/v1
kind: Deployment

metadata:
  name: web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web

          image: registry.uniproject.jp/official/presen-comeview-front:0.1.0

          ports:
            - containerPort: 80

          env:
            - name: VITE_PUBLIC_WS_URL
              value: wss://api-comeview.uniproject.jp

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 300m
              memory: 256Mi
      imagePullSecrets:
        - name: internal-harbor
