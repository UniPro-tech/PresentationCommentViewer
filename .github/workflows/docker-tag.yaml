name: Docker Build and Push

on:
  push:
    tags:
      - "server@*"
      - "web@*"
  workflow_dispatch:
    inputs:
      service:
        description: "対象サービス"
        required: true
        type: choice
        options:
          - server
          - web
      version:
        description: "バージョン (例: 1.0.0)"
        required: true
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract service & version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ inputs.service }}"
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            SERVICE=$(echo "$REF" | cut -d'@' -f1)
            VERSION=$(echo "$REF" | cut -d'@' -f2 | sed 's/^v//')
          fi

          echo "SERVICE=$SERVICE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set build context
        run: |
          case "$SERVICE" in
            server)
              echo "DIR=apps/server" >> $GITHUB_ENV
              echo "IMAGE=registry.uniproject.jp/official/presen-comeview-api" >> $GITHUB_ENV
              ;;
            web)
              echo "DIR=apps/web" >> $GITHUB_ENV
              echo "IMAGE=registry.uniproject.jp/official/presen-comeview-front" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown service: $SERVICE"; exit 1;
          esac

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.uniproject.jp
          username: robot$github-publisher
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract version parts
        run: |
          VERSION=${{ env.VERSION }}

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest 
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }}
            type=raw,value=${{ env.MAJOR }}
            type=sha
          labels: |
            org.opencontainers.image.title="${{ env.SERVICE }}"
            org.opencontainers.image.vendor="All-Japan Digital Creative Club UniProject"
            org.opencontainers.image.licenses="AGPL-3.0"

      - name: Build & Push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./${{ env.DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Cosign sign
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes ${IMAGE}@${DIGEST}
